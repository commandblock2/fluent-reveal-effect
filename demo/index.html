        <title>Fluent Design Effect Demo</title>
        <style>
            :root {
                /* Background tint (mica overlay) */
                --app-tint-rgb: 10, 10, 20;
                --app-tint-alpha-start: 0.6;
                --app-tint-alpha-end: 0.35;

                /* Small visual tweaks */
                --btn-overlay-alpha: 0.12;
                --panel-bg: rgba(255, 255, 255, 0.08);
                --btn-border-bg: rgba(255, 255, 255, 0.09);

                /* Mica surface + controls (shared) */
                --mica-surface-bg: rgba(255, 255, 255, 0.1);
                --mica-surface-border: rgba(255, 255, 255, 0.18);

                /* Controls inherit the exact same visual as the surface */
                --mica-control-bg: var(--mica-surface-bg);
                --mica-control-border: var(--mica-surface-border);
            }

            html,
            body {
                height: 100%;
            }

            /* Override demo/src/style.css body background + padding so the image shows through */
            body {
                margin: 0;
                padding: 0 !important;
                background: transparent !important;
            }

            #app {
                min-height: 100vh;
                padding: 3rem;
                position: relative;

                background-image: url("./src/background.png");
                background-position: center;
                background-size: cover;
                background-repeat: no-repeat;
                background-attachment: fixed;
            }

            /* Tinted layer over the wallpaper (helps readability + "mica" vibe) */
            #app::before {
                content: "";
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;

                background: linear-gradient(
                    135deg,
                    rgba(var(--app-tint-rgb), var(--app-tint-alpha-start)),
                    rgba(var(--app-tint-rgb), var(--app-tint-alpha-end))
                );
            }

            /* Acrylic/mica-like surface for the demo content */
            .mica-surface {
                position: relative;
                z-index: 1;

                max-width: 1100px;
                margin: 0 auto;
                padding: 2.25rem 2rem;

                border-radius: 0px;
                background: var(--mica-surface-bg);
                border: 1px solid var(--mica-surface-border);
                box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);

                backdrop-filter: blur(18px) saturate(140%);

                /* clip the blur + highlight to rounded corners */
                overflow: hidden;
            }

            /* Subtle highlight grain */
            .mica-surface::before {
                content: "";
                position: absolute;
                inset: 0;
                pointer-events: none;

                background: radial-gradient(
                    1200px circle at 20% 0%,
                    rgba(255, 255, 255, 0.16),
                    rgba(255, 255, 255, 0) 55%
                );
            }

            .mica-surface > * {
                position: relative;
                z-index: 1;
            }

            /* Keep the button group panel, but make it feel more "acrylic" */
            .mica-surface .toolbar-2 {
                background-color: var(--panel-bg);
            }

            /* Slightly more "opaque" buttons + border containers (visual only) */
            .mica-surface .btn {
                box-shadow: inset 0 0 0 1000px
                    rgba(255, 255, 255, var(--btn-overlay-alpha)) !important;
            }

            .mica-surface .btn-border {
                background-color: var(--btn-border-bg) !important;
                border-radius: 0px;

                /* Reveal (border effect): thickness of the "ring" mask */
                --fx-border-width: 1px;
            }

            /* Mica-colored buttons: visually blend with the mica surface (no "solid" color) */
            .mica-surface .btn-border.btn-mica {
                background: var(--mica-control-bg) !important;
                /* border: 1px solid color-mix(in srgb, var(--mica-control-border) 80, black 20) ; */
                border-radius: 0px;
                /* overflow: hidden; */

                /* backdrop-filter: blur(14px) saturate(140%); */
            }

            .mica-surface .btn-border.btn-mica-double {
                background: var(--mica-control-bg) !important;
                /* border: 1px solid color-mix(in srgb, var(--mica-control-border) 80, black 20) ; */
                border-radius: 0px;
                /* overflow: hidden; */

                backdrop-filter: blur(14px) saturate(140%);
            }

            .mica-surface .btn.btn-mica {
                background-color: transparent !important;
                box-shadow: none !important;
            }

            /* ------------------------------------------------------------------
             * Reveal (border effect): mask the glow to the border only
             *
             * The library renders the glow on `.eff-reveal-border-fx::before`.
             * For transparent/mica buttons, we want the glow to appear only as a
             * border ring, without affecting the background fill.
             *
             * NOTE: The library injects its own CSS at runtime. To ensure this
             * wins, we use a more specific selector scoped to `.mica-surface`.
             * ------------------------------------------------------------------ */
            .mica-surface .eff-reveal-border-fx {
                position: relative;
                border-radius: inherit;
            }

            .mica-surface .eff-reveal-border-fx::before {
                border-radius: inherit;
                box-sizing: border-box;

                padding: var(--fx-border-width, 1px);

                mask:
                    linear-gradient(#000 0 0) content-box,
                    linear-gradient(#000 0 0);
                mask-composite: exclude;
            }

            /* Fallback if backdrop-filter isn't supported */
            @supports not ((backdrop-filter: blur(1px))) {
                .mica-surface {
                    background: rgba(0, 0, 0, 0.55);
                }
            }
        </style>
